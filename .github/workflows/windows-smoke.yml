name: Windows desktop validation

on:
  push:
    branches: [codex/storyboard-delivery-validation, codex/windows-smoke, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Exercise the Windows launcher and desktop widgets
        run: python tests/windows_smoke.py
