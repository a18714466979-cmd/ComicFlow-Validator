name: Windows desktop validation

on:
  push:
    branches: [codex/storyboard-delivery-validation, codex/chinese-production, codex/windows-smoke, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install desktop dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Build Windows trial archive
        run: python -m scripts.windows_trial dist/ComicFlow-Windows-Trial.zip --revision ${{ github.sha }}
      - name: Install the unpacked trial and test the desktop and delivery paths
        run: python -m scripts.verify_windows_trial dist/ComicFlow-Windows-Trial.zip --install
      - name: Upload Windows trial archive
        if: github.ref != 'refs/heads/codex/chinese-production'
        uses: actions/upload-artifact@v7
        with:
          path: dist/ComicFlow-Windows-Trial.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
